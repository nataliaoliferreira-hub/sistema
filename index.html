<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef6ff">
<link rel="manifest" href="manifest.json">
<title>Sistema IA</title>

<style>
:root{
--bg:#f5f9ff;
--panel:#ffffff;
--blue:#2878ee;
--blue2:#64b5ff;
--ink:#13213b;
--muted:#6f7d96;
--line:#dce9f8;
--mine:#dcecff;
--shadow:0 10px 30px rgba(46,105,180,.10)
}

*{box-sizing:border-box}

html,body{
margin:0;
height:100%;
font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
background:var(--bg);
color:var(--ink)
}

body{overflow:hidden}

.app{
height:100dvh;
max-width:760px;
margin:auto;
display:flex;
flex-direction:column;
background:linear-gradient(#eef6ff 0,#f9fbff 22%,#f5f9ff 100%)
}

.top{
flex:0 0 auto;
padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
background:rgba(255,255,255,.88);
backdrop-filter:blur(16px);
border-bottom:1px solid var(--line)
}

.topline{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.brand{
font-weight:800;
font-size:18px
}

.energy{
border:1px solid #bcd8fb;
background:#fff;
color:#315f99;
border-radius:999px;
padding:9px 12px;
font-weight:700
}

.energy-menu{
display:none;
gap:7px;
margin-top:10px
}

.energy-menu.show{
display:flex
}

.energy-menu button{
flex:1;
border:1px solid var(--line);
background:white;
border-radius:14px;
padding:9px;
color:var(--ink)
}

.energy-menu button.active{
background:#e0efff;
border-color:#75adf2;
color:#155fb8
}

.chat{
flex:1;
overflow:auto;
padding:18px 14px 140px;
scroll-behavior:smooth
}

.day{
text-align:center;
color:#8a97aa;
font-size:12px;
margin:4px 0 18px
}

.msg{
display:flex;
margin:0 0 14px
}

.msg.user{
justify-content:flex-end
}

.bubble{
max-width:86%;
padding:13px 15px;
border-radius:20px;
line-height:1.45;
box-shadow:0 3px 12px rgba(28,71,120,.05);
white-space:pre-wrap
}

.user .bubble{
background:var(--mine);
border-bottom-right-radius:6px
}

.ai .bubble{
background:white;
border:1px solid #e5edf8;
border-bottom-left-radius:6px
}

.meta{
font-size:11px;
color:#8190a6;
margin-top:6px
}

.typing{
display:flex;
gap:5px;
align-items:center
}

.typing i{
width:7px;
height:7px;
background:#6aa8f4;
border-radius:50%;
animation:b 1s infinite alternate
}

.typing i:nth-child(2){
animation-delay:.18s
}

.typing i:nth-child(3){
animation-delay:.36s
}

@keyframes b{
to{
transform:translateY(-5px);
opacity:.45
}
}

.composer-wrap{
position:absolute;
left:0;
right:0;
bottom:0;
max-width:760px;
margin:auto;
padding:10px 12px calc(10px + env(safe-area-inset-bottom));
background:linear-gradient(transparent,rgba(245,249,255,.96) 24%)
}

.recording-box{
display:none;
background:white;
border:1px solid var(--line);
box-shadow:var(--shadow);
border-radius:22px;
padding:12px 14px;
margin-bottom:8px
}

.recording-box.show{
display:block
}

.rec-top{
display:flex;
align-items:center;
justify-content:space-between;
font-size:13px;
color:#5e6d84
}

.timer{
font-variant-numeric:tabular-nums;
font-weight:800;
color:#245f9f
}

.wave{
height:42px;
display:flex;
align-items:center;
justify-content:center;
gap:3px;
margin-top:5px
}

.wave span{
width:3px;
height:8px;
border-radius:4px;
background:#3d8df2;
animation:wave .65s ease-in-out infinite alternate;
animation-play-state:paused
}

.recording-box.show .wave span{
animation-play-state:running
}

.wave span:nth-child(3n){
animation-delay:.1s
}

.wave span:nth-child(4n){
animation-delay:.2s
}

.wave span:nth-child(5n){
animation-delay:.3s
}

@keyframes wave{
to{height:34px}
}

.composer{
display:flex;
align-items:flex-end;
gap:8px;
background:white;
border:1px solid var(--line);
box-shadow:var(--shadow);
border-radius:24px;
padding:8px
}

textarea{
flex:1;
resize:none;
border:0;
outline:0;
background:transparent;
min-height:44px;
max-height:110px;
padding:11px 8px;
font:inherit;
color:var(--ink)
}

.iconbtn{
border:0;
width:46px;
height:46px;
border-radius:50%;
font-size:21px;
display:grid;
place-items:center
}

.mic{
background:linear-gradient(135deg,#65b6ff,#2878ee);
color:white
}

.send{
background:#e7f2ff;
color:#1769c5
}

.mic.recording{
background:#ff6d72
}

.hint{
text-align:center;
font-size:11px;
color:#8795a8;
margin-top:6px
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="topline">

<div>
<div class="brand">Sistema IA</div>
<div style="font-size:12px;color:#74839a">
Conversa em foco
</div>
</div>

<button class="energy" id="energyBtn">
⚡ Energia: média
</button>

</div>

<div class="energy-menu" id="energyMenu">

<button data-energy="baixa">
🔋 Baixa
</button>

<button data-energy="media" class="active">
⚡ Média
</button>

<button data-energy="boa">
✨ Boa
</button>

</div>

</header>

<main class="chat" id="chat">

<div class="day">
Hoje
</div>

<div class="msg ai">
<div class="bubble">
Pode falar comigo do seu jeito. Se usar o microfone, primeiro vou mostrar a transcrição do que você disse e depois a resposta.
</div>
</div>

</main>

<div class="composer-wrap">

<div class="recording-box" id="recordingBox">

<div class="rec-top">

<span>
🎙️ Gravando… toque no botão vermelho para parar
</span>

<span class="timer" id="timer">
00:00
</span>

</div>

<div class="wave" id="wave"></div>

</div>

<div class="composer">

<textarea
id="text"
rows="1"
placeholder="Digite ou fale o que quiser…">
</textarea>

<button
class="iconbtn mic"
id="micBtn"
aria-label="Gravar áudio">
🎙️
</button>

<button
class="iconbtn send"
id="sendBtn"
aria-label="Enviar">
➤
</button>

</div>

<div class="hint" id="hint">
Sua conversa fica visível nesta tela.
</div>

</div>

</div>

<script>

const API_URL =
"https://sistema-ia.natalia-oliferreira.workers.dev";

const state={
energy:"media",
mediaRecorder:null,
chunks:[],
timer:null,
seconds:0
};

const chat=
document.getElementById("chat");

const text=
document.getElementById("text");

const micBtn=
document.getElementById("micBtn");

const sendBtn=
document.getElementById("sendBtn");

const hint=
document.getElementById("hint");

const recordingBox=
document.getElementById("recordingBox");

const timerEl=
document.getElementById("timer");

for(let i=0;i<34;i++){

const s=
document.createElement("span");

document
.getElementById("wave")
.appendChild(s);

}

function scrollBottom(){

setTimeout(
()=>chat.scrollTop=chat.scrollHeight,
30
);

}

function esc(s){

return String(s)
.replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}

function addMsg(
who,
content,
meta=""
){

const d=
document.createElement("div");

d.className=
"msg "+who;

d.innerHTML=
`<div class="bubble">
${esc(content)}
${meta
?`<div class="meta">${esc(meta)}</div>`
:""}
</div>`;

chat.appendChild(d);

scrollBottom();

return d;

}

function addTyping(){

const d=
document.createElement("div");

d.className=
"msg ai";

d.innerHTML=
'<div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';

chat.appendChild(d);

scrollBottom();

return d;

}

function saveLocal(
role,
textValue
){

const h=
JSON.parse(
localStorage.getItem("chatHistory")||
"[]"
);

h.push({
role,
text:textValue,
time:new Date().toISOString()
});

localStorage.setItem(
"chatHistory",
JSON.stringify(
h.slice(-50)
)
);

}

async function askText(value){

addMsg(
"user",
value,
"Você"
);

saveLocal(
"user",
value
);

text.value="";

const typing=
addTyping();

try{

const r=
await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

energy:
state.energy,

context:
"conversa",

text:
value

})

});

const d=
await r.json();

typing.remove();

if(!r.ok || !d.reply){

throw new Error(
d.error||"Erro"
);

}

addMsg(
"ai",
d.reply,
"Sistema IA"
);

saveLocal(
"assistant",
d.reply
);

}catch(e){

typing.remove();

addMsg(
"ai",
"Não consegui falar com a IA agora. Tente novamente em alguns instantes."
);

}

}

sendBtn.onclick=()=>{

const v=
text.value.trim();

if(v){
askText(v);
}

};

text.addEventListener(
"input",
()=>{

text.style.height="auto";

text.style.height=
Math.min(
text.scrollHeight,
110
)+"px";

}
);

text.addEventListener(
"keydown",
e=>{

if(
e.key==="Enter" &&
!e.shiftKey
){

e.preventDefault();

const v=
text.value.trim();

if(v){
askText(v);
}

}

}
);

document
.getElementById("energyBtn")
.onclick=()=>{

document
.getElementById("energyMenu")
.classList.toggle("show");

};

document
.querySelectorAll("[data-energy]")
.forEach(
b=>b.onclick=()=>{

state.energy=
b.dataset.energy;

document
.querySelectorAll("[data-energy]")
.forEach(
x=>x.classList.remove("active")
);

b.classList.add("active");

const names={

baixa:
"🔋 Energia: baixa",

media:
"⚡ Energia: média",

boa:
"✨ Energia: boa"

};

document
.getElementById("energyBtn")
.textContent=
names[state.energy];

document
.getElementById("energyMenu")
.classList.remove("show");

}
);

function startTimer(){

state.seconds=0;

timerEl.textContent=
"00:00";

state.timer=
setInterval(
()=>{

state.seconds++;

const m=
String(
Math.floor(
state.seconds/60
)
).padStart(2,"0");

const s=
String(
state.seconds%60
).padStart(2,"0");

timerEl.textContent=
`${m}:${s}`;

},
1000
);

}

function stopTimer(){

clearInterval(
state.timer
);

state.timer=null;

}

micBtn.onclick=
async()=>{

if(
state.mediaRecorder &&
state.mediaRecorder.state==="recording"
){

state.mediaRecorder.stop();

return;

}

try{

const stream=
await navigator
.mediaDevices
.getUserMedia({
audio:true
});

state.chunks=[];

const opts=
MediaRecorder
.isTypeSupported(
"audio/webm;codecs=opus"
)
?
{
mimeType:
"audio/webm;codecs=opus"
}
:
{};

state.mediaRecorder=
new MediaRecorder(
stream,
opts
);

state.mediaRecorder
.ondataavailable=
e=>{

if(e.data.size){

state.chunks.push(
e.data
);

}

};

state.mediaRecorder
.onstop=
async()=>{

stopTimer();

recordingBox
.classList
.remove("show");

micBtn
.classList
.remove("recording");

micBtn.textContent=
"🎙️";

stream
.getTracks()
.forEach(
t=>t.stop()
);

hint.textContent=
"Transcrevendo sua fala…";

const typing=
addTyping();

try{

const blob=
new Blob(
state.chunks,
{
type:
state.mediaRecorder.mimeType||
"audio/webm"
}
);

const form=
new FormData();

form.append(
"audio",
blob,
"audio.webm"
);

form.append(
"energy",
state.energy
);

form.append(
"context",
"conversa por voz"
);

const r=
await fetch(
API_URL,
{
method:"POST",
body:form
}
);

const d=
await r.json();

typing.remove();

if(
!r.ok ||
!d.reply
){

throw new Error(
d.error||"Erro"
);

}

const spoken=
d.transcription||
"(Não consegui recuperar a transcrição.)";

addMsg(
"user",
spoken,
"Transcrição da sua fala"
);

saveLocal(
"user",
spoken
);

const thinking=
addTyping();

setTimeout(
()=>{

thinking.remove();

addMsg(
"ai",
d.reply,
"Sistema IA"
);

saveLocal(
"assistant",
d.reply
);

},
180
);

hint.textContent=
"Transcrição concluída.";

}catch(e){

typing.remove();

addMsg(
"ai",
"Não consegui processar esse áudio. Tente novamente."
);

hint.textContent=
"Falha ao processar o áudio.";

}

};

state.mediaRecorder.start();

recordingBox
.classList
.add("show");

micBtn
.classList
.add("recording");

micBtn.textContent=
"■";

hint.textContent=
"Estou ouvindo…";

startTimer();

}catch(e){

hint.textContent=
"Não consegui acessar o microfone. Verifique a permissão do navegador.";

}

};

const old=
JSON.parse(
localStorage.getItem("chatHistory")||
"[]"
);

if(old.length){

chat.innerHTML=
'<div class="day">Conversa recente</div>';

old
.slice(-20)
.forEach(
m=>addMsg(
m.role==="user"
?"user"
:"ai",
m.text,
m.role==="user"
?"Você"
:"Sistema IA"
)
);

}

scrollBottom();

</script>

</body>
  </html>
